<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Express + Nginx</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 3rem 4rem;
      border-radius: 1rem;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    h1 { margin: 0 0 0.5rem; font-size: 2.5rem; }
    p { margin: 0; opacity: 0.85; font-size: 1.1rem; }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from Express + Nginx!</h1>
    <p>Served via Nginx reverse proxy on port 80</p>
    <div class="badge">Node 22 Alpine &middot; nginx:alpine &middot; Docker Compose</div>
  </div>
</body>
</html>
