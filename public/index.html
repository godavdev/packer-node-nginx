<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Express</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #f1f5f9;
      }
      .card {
        background: #1e293b;
        padding: 3rem 4rem;
        border-radius: 1.5rem;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,.5);
        text-align: center;
        border: 1px solid #334155;
        max-width: 480px;
      }
      .badge {
        display: inline-block;
        background: #22c55e;
        color: #052e16;
        font-size: .75rem;
        font-weight: 600;
        padding: .25rem .75rem;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: .05em;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: .75rem;
        background: linear-gradient(to right, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
        font-size: .95rem;
      }
      .stack {
        margin-top: 1.5rem;
        display: flex;
        justify-content: center;
        gap: .5rem;
        flex-wrap: wrap;
      }
      .tag {
        background: #334155;
        padding: .25rem .75rem;
        border-radius: 6px;
        font-size: .8rem;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">En línea</span>
      <h1>Hola desde Express</h1>
      <p>Servido mediante Nginx como proxy inverso en el puerto 80</p>
      <div class="stack">
        <span class="tag">Express</span>
        <span class="tag">Nginx</span>
        <span class="tag">Docker</span>
      </div>
    </div>
  </body>
</html>
